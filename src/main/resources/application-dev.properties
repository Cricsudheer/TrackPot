spring.profiles=dev

# allow Hibernate auto-update during development
spring.jpa.hibernate.ddl-auto=update

# point at your local dev database
spring.datasource.url=jdbc:postgresql://localhost:5432/snooker_dev
spring.datasource.username=dev_user
spring.datasource.password=dev_pass

# lower log threshold for debugging
logging.level.com.example.trackpot=DEBUG
